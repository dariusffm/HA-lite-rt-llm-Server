name: "LiteRT LLM Server"
version: "0.7.1"
slug: litert_llm_server
description: "Local LLM inference via Google LiteRT with OpenAI- and Ollama-compatible APIs"
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: "HTTP API (OpenAI + Ollama)"
options:
  log_level: info
  default_model: "gemma-4-e2b"
  max_tokens: 1024
  temperature: 0.7
  tool_calling: true
  context_length: 8192
  prompt_compaction: auto
  conversation_ttl: 300
  tool_call_repair: true
  switching_tool_names:
    - HassTurnOn
    - HassTurnOff
    - HassToggle
  switching_block_reply: "Welches Gerät oder welchen Bereich meinst du genau?"
  engine_wait_timeout: 0
  generation_timeout: 240
  preload_models: []
  hf_token: ""
schema:
  log_level: list(trace|debug|info|warning|error|critical)
  default_model: str
  max_tokens: int(1,32768)
  temperature: float(0.0,2.0)
  tool_calling: bool
  context_length: int(2048,32768)
  prompt_compaction: list(off|on|auto)
  conversation_ttl: int(0,3600)
  tool_call_repair: bool
  switching_tool_names:
    - str
  switching_block_reply: str
  engine_wait_timeout: int(0,600)
  generation_timeout: int(0,600)
  preload_models:
    - str
  hf_token: password?
